default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL", 10) %>
  checkout_timeout: 5

development:
  <<: *default
  database: workhappy_development

test:
  <<: *default
  database: workhappy_test
  url: <%= ENV["TEST_DATABASE_URL"] %>
  # Tests create their own records. DemoSeedsTest explicitly tests seed loading.
  seeds: false

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
